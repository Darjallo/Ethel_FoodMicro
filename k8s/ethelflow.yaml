apiVersion: apps/v1
kind: Deployment
metadata:
  name: ethelflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ethelflow
  template:
    metadata:
      labels:
        app: ethelflow
    spec:
      containers:
        - name: ethelflow
          image: ethelflow:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "ethelflow"]
          env:
            - name: ETHELFLOW_MONGODB_URI
              value: mongodb://mongodb:27017
            - name: ETHELFLOW_MONGODB_DB
              value: ethelflow
---
apiVersion: v1
kind: Service
metadata:
  name: ethelflow
spec:
  selector:
    app: ethelflow
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP