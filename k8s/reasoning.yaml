apiVersion: apps/v1
kind: Deployment
metadata:
  name: reasoning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reasoning
  template:
    metadata:
      labels:
        app: reasoning
    spec:
      containers:
        - name: reasoning
          image: ethelflow:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "ethelflow.agents.reasoning"]
          env:
            - name: ETHELFLOW_S3_ENDPOINT_URL
              value: http://minio:9000
            - name: ETHELFLOW_S3_ACCESS_KEY
              value: minio
            - name: ETHELFLOW_S3_SECRET_KEY
              value: minio123
            - name: ETHELFLOW_S3_BUCKET_NAME
              value: ethel
            - name: ETHELFLOW_REASONING_AZURE_ENDPOINT
              value: https://cog-openai-ethel.openai.azure.com/
            - name: ETHELFLOW_REASONING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: azure-openai-secrets
                  key: api_key

---
apiVersion: v1
kind: Service
metadata:
  name: reasoning
spec:
  selector:
    app: reasoning
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
