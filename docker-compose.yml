version: "3.9"

services:

  flow_manager:
    image: flow_manager:latest
    deploy:
      replicas: 5
      restart_policy:
        condition: on-failure
    networks:
      - ethel_net
    ports:
      - "8000:8000" 
    env_file:
      - ./secret/.env
      - ./secret/emb_ada3large/.env
    volumes:
      - /etc/letsencrypt/fullchain.pem:/run/certs/fullchain.pem:ro
      - /etc/letsencrypt/privkey.pem:/run/certs/privkey.pem:ro
      - ./flow_manager/flows:/app/flows:ro
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=ethel_files
      - SSL_CERT_PATH=/run/certs/fullchain.pem
      - SSL_KEY_PATH=/run/certs/privkey.pem
      - SSL_PORT=8000

  emb_file_ada3large:
    image: emb_file_ada3large:latest
    deploy:
      replicas: 5
      restart_policy:
        condition: on-failure
    networks:
      - ethel_net
    env_file:
      - ./secret/.env
      - ./secret/emb_file_ada3large/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=ethel_files
      - CHROMA_BASE_DIR=/chroma_db
    volumes:
      - /var/lib/ethel/chroma_db:/chroma_db
        
  test_agent:
    image: test_agent:latest
    deploy:
      replicas: 5
      restart_policy:
        condition: on-failure
    networks:
      - ethel_net

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      TZ: "UTC"
    networks:
      - ethel_net


networks:
  ethel_net:
    driver: overlay

volumes:
  mongo_data:
