version: "3.9"

services:
  flow_manager:
    image: flow_manager:latest
    deploy:
      replicas: 5
      restart_policy:
        condition: on-failure
    networks:
      - ethel_net
    ports:
      - "8000:8000" 
    volumes:
      - /etc/letsencrypt/fullchain.pem:/run/certs/fullchain.pem:ro
      - /etc/letsencrypt/privkey.pem:/run/certs/privkey.pem:ro
    environment:
      - SSL_CERT_PATH=/run/certs/fullchain.pem
      - SSL_KEY_PATH=/run/certs/privkey.pem
      - SSL_PORT=8000

  test_agent:
    image: test_agent:latest
    deploy:
      replicas: 5
      restart_policy:
        condition: on-failure
    networks:
      - ethel_net

  milvus:
    image: milvusdb/milvus:v2.2.14
    container_name: milvus
    command: ["milvus","run","standalone"]
    ports:
      - "19530:19530"   # gRPC
      - "19121:19121"   # HTTP/REST
    volumes:
      - milvus_data:/var/lib/milvus
    environment:
      TZ: "UTC"
      MILVUS_LOG_LEVEL: "warning"

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      TZ: "UTC"

networks:
  ethel_net:
    driver: overlay

volumes:
  milvus_data:
  mongo_data:
